name: collect

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각에 예약. 한 번에 70분씩 돌아 다음 잡이 곧바로 이어받는다.
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: data 브랜치 준비
        run: |
          git config user.name "candle-bot"
          git config user.email "candle-bot@users.noreply.github.com"
          git fetch origin data || true
          if git rev-parse --verify -q origin/data > /dev/null; then
            git worktree add -B data datawt origin/data
          else
            git worktree add --detach datawt
            cd datawt
            git checkout -q --orphan data
            git rm -rf -q . || true
          fi

      - name: 15초마다 수집
        env:
          RUN_MIN: '70'
        run: node scripts/collect.mjs
